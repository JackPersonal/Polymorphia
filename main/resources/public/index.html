
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymorphia Server</title>
    <script src="maze.js"></script>
    <script src="mazeDrawing.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e8eaf6;
            min-height: 100vh;
            padding: 20px 0;
        }

        .main-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            background: #3f51b5;
            color: white;
            padding: 25px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            margin: 0;
        }

        .card {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .card-header {
            background: #5c6bc0;
            color: white;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 6px 6px 0 0;
            border: none;
        }

        .btn-primary {
            background: #5c6bc0;
            border: 1px solid #5c6bc0;
            color: white;
        }

        .btn-primary:hover {
            background: #3f51b5;
            border-color: #3f51b5;
        }

        .btn-success {
            background: #66bb6a;
            border: 1px solid #66bb6a;
            color: white;
        }

        .btn-success:hover {
            background: #4caf50;
            border-color: #4caf50;
        }

        .btn-outline-secondary {
            border: 1px solid #757575;
            color: #757575;
        }

        .btn-outline-secondary:hover {
            background: #757575;
            color: white;
        }

        .status-badge {
            padding: 10px 15px;
            border-radius: 6px;
            background: #e3f2fd;
            color: #1565c0;
            font-weight: 600;
            border: 1px solid #bbdefb;
        }

        .maze-container {
            background: #37474f;
            border-radius: 6px;
            padding: 15px;
            border: 1px solid #e0e0e0;
        }

        .zoom-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .zoom-level {
            color: white;
            font-weight: 600;
            min-width: 60px;
            text-align: center;
            font-size: 0.9rem;
        }

        #maze-wrapper {
            border-radius: 4px;
            background: #455a64;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            overflow: hidden;
        }

        #maze {
            display: block;
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        .parameter-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #7986cb;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            margin: 4px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .parameter-chip .value {
            background: rgba(255, 255, 255, 0.25);
            padding: 2px 8px;
            border-radius: 3px;
            font-weight: 600;
        }

        .parameter-chip .remove-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 18px;
            height: 18px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .parameter-chip .remove-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .parameter-list {
            border: 2px dashed #c5cae9;
            border-radius: 6px;
            padding: 12px;
            min-height: 70px;
            background: #f5f5f5;
        }

        .empty-state {
            text-align: center;
            color: #9e9e9e;
            font-style: italic;
            font-size: 0.9rem;
        }

        .preset-btn {
            padding: 6px 14px;
            border: 1px solid #9fa8da;
            background: white;
            color: #5c6bc0;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .preset-btn:hover, .preset-btn.active {
            background: #7986cb;
            color: white;
            border-color: #7986cb;
        }

        .form-control, .form-select {
            border: 1px solid #cfd8dc;
            border-radius: 4px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #7986cb;
            box-shadow: 0 0 0 0.2rem rgba(121, 134, 203, 0.25);
        }

        .control-panel {
            background: #fafafa;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
    </style>
</head>
<body onload="loadDefaultData()">
<div class="container-fluid px-3">
    <div class="main-container">
        <div class="header">
            <h1>Polymorphia Server</h1>
        </div>

        <div class="control-panel">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Select Game to View:</label>
                    <select class="form-select" id="gameDropDown" onchange="getGame()"></select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Game Status:</label>
                    <div class="status-badge" id="statusMessage">Ready</div>
                </div>
            </div>

            <div class="row g-3">
                <button class="btn btn-primary w-100 mt-3" onclick="saveGame()">Save Game</button>
            </div>

            <div class="row g-3 mt-2">
                <div class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="playAutomatically"
                               onclick="updateAutomatically()">
                        <label class="form-check-label fw-bold">Play Automatically</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Seconds between turns:</label>
                    <input class="form-control" type="number" id="secondBetweenTurns" value="2">
                </div>
            </div>
        </div>

        <div class="row g-4 p-4">
            <!-- Left Column -->
            <div class="col-lg-4">
                <!-- Game Controls -->
                <div class="card">
                    <div class="card-header">Select Command</div>
                    <div class="card-body">
                        <select class="form-select" id="commandChoice" size="5">
                            <option value="move">Move</option>
                            <option value="fight">Fight</option>
                            <option value="eat">Eat</option>
                            <option value="wear">Wear Armor</option>
                        </select>
                        <button class="btn btn-primary w-100 mt-3" onclick="submitCommand()">Submit Command</button>
                        <button class="btn btn-primary w-100 mt-3" onclick="getCommandChoices()">Update Choices</button>
                        <button class="btn btn-primary w-100 mt-3" onclick="getGame()">Update Maze</button>
                        <button class="btn btn-primary w-100 mt-3" onclick="playTurn()">Play Turn</button>
                    </div>
                </div>

                <!-- Create Game Panel -->
                <div class="card">
                    <div class="card-header">Create New Game</div>
                    <div class="card-body">
                        <!-- Presets -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Quick Presets:</label>
                            <div class="d-flex gap-2 flex-wrap">
                                <button class="preset-btn" onclick="applyPreset('small')">Small</button>
                                <button class="preset-btn active" onclick="applyPreset('medium')">Medium</button>
                                <button class="preset-btn" onclick="applyPreset('large')">Large</button>
                                <button class="preset-btn" onclick="applyPreset('epic')">Epic</button>
                            </div>
                        </div>

                        <!-- Player Name -->
                        <div class="mb-3">
                            <label class="form-label">Player's Name:</label>
                            <input class="form-control" id="playerName" type="text" value="Professor">
                        </div>

                        <!-- Parameter Selector -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Add Parameters:</label>
                            <div class="input-group">
                                <select class="form-select" id="parameterSelector">
                                    <option value="">-- Select --</option>
                                    <option value="numRooms">Rooms</option>
                                    <option value="numAdventurers">Adventurers</option>
                                    <option value="numKnights">Knights</option>
                                    <option value="numCowards">Cowards</option>
                                    <option value="numGluttons">Gluttons</option>
                                    <option value="numCreatures">Creatures</option>
                                    <option value="numDemons">Demons</option>
                                    <option value="numFood">Food Items</option>
                                    <option value="numArmor">Armor Suits</option>
                                </select>
                                <input type="number" class="form-control" id="parameterValue"
                                       value="1" min="0" style="max-width: 80px;">
                                <button class="btn btn-primary" onclick="addParameter()">+</button>
                            </div>
                        </div>

                        <!-- Selected Parameters -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between mb-2">
                                <label class="form-label fw-bold mb-0">Selected:</label>
                                <button class="btn btn-sm btn-outline-secondary" onclick="clearAllParameters()">
                                    Clear All
                                </button>
                            </div>
                            <div id="parameterList" class="parameter-list"></div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-grid gap-2">
                            <button class="btn btn-success" onclick="createGame()">Create Game</button>
                            <button class="btn btn-success" onclick="createTournament()">Create Tournament</button>
                            <button class="btn btn-success" onclick="createNextRound()">Create Next Round</button>
                        </div>

                        <div id="newGameStatus" class="mt-3"></div>
                    </div>
                </div>
            </div>

            <!-- Right Column - Maze -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <h5 id="gameTitle" class="mb-3">Maze Name</h5>
                        <div class="maze-container">
                            <div class="zoom-controls">
                                <div class="zoom-btn" onclick="adjustZoom(-0.1)" title="Zoom Out">−</div>
                                <div class="zoom-level" id="zoomLevel">100%</div>
                                <div class="zoom-btn" onclick="adjustZoom(0.1)" title="Zoom In">+</div>
                                <div class="zoom-btn" onclick="resetZoom()" title="Reset">⟲</div>
                            </div>
                            <div id="maze-wrapper">
                                <svg id="maze" width="800" height="800">
                                    <text x="400" y="400" text-anchor="middle" fill="white" font-size="16">
                                        Select a game to view
                                    </text>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentZoom = 1.0;
    const minZoom = 0.3;
    const maxZoom = 2.0;
    let selectedParams = {};

    const parameterLabels = {
        numRooms: 'Rooms',
        numAdventurers: 'Adventurers',
        numKnights: 'Knights',
        numCowards: 'Cowards',
        numGluttons: 'Gluttons',
        numCreatures: 'Creatures',
        numDemons: 'Demons',
        numFood: 'Food Items',
        numArmor: 'Armor Suits'
    };

    function addParameter() {
        const selector = document.getElementById('parameterSelector');
        const valueInput = document.getElementById('parameterValue');
        const paramKey = selector.value;
        const paramValue = parseInt(valueInput.value);

        if (!paramKey) {
            alert('Please select a parameter');
            return;
        }

        selectedParams[paramKey] = paramValue;
        renderParameterList();
        selector.value = '';
    }

    function removeParameter(paramKey) {
        delete selectedParams[paramKey];
        renderParameterList();
    }

    function clearAllParameters() {
        selectedParams = {};
        renderParameterList();
    }

    function renderParameterList() {
        const container = document.getElementById('parameterList');

        if (Object.keys(selectedParams).length === 0) {
            container.innerHTML = '<div class="empty-state">No parameters added</div>';
            return;
        }

        container.innerHTML = '';
        for (const [key, value] of Object.entries(selectedParams)) {
            const chip = document.createElement('div');
            chip.className = 'parameter-chip';
            chip.innerHTML = `
                    <span>${parameterLabels[key]}</span>
                    <span class="value">${value}</span>
                    <button class="remove-btn" onclick="removeParameter('${key}')">×</button>
                `;
            container.appendChild(chip);
        }
    }

    function applyPreset(size) {
        document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');

        const presets = {
            small: {
                numRooms: 5,
                numAdventurers: 1,
                numKnights: 1,
                numCowards: 1,
                numGluttons: 1,
                numCreatures: 2,
                numDemons: 2,
                numFood: 3,
                numArmor: 1
            },
            medium: {
                numRooms: 9,
                numAdventurers: 2,
                numKnights: 2,
                numCowards: 2,
                numGluttons: 2,
                numCreatures: 4,
                numDemons: 4,
                numFood: 7,
                numArmor: 2
            },
            large: {
                numRooms: 15,
                numAdventurers: 4,
                numKnights: 3,
                numCowards: 3,
                numGluttons: 3,
                numCreatures: 8,
                numDemons: 6,
                numFood: 12,
                numArmor: 4
            },
            epic: {
                numRooms: 20,
                numAdventurers: 6,
                numKnights: 5,
                numCowards: 5,
                numGluttons: 5,
                numCreatures: 12,
                numDemons: 10,
                numFood: 20,
                numArmor: 6
            }
        };

        selectedParams = {...presets[size]};
        renderParameterList();
    }

    function adjustZoom(delta) {
        currentZoom = Math.max(minZoom, Math.min(maxZoom, currentZoom + delta));
        updateZoom();
    }

    function resetZoom() {
        currentZoom = 1.0;
        updateZoom();
    }

    function updateZoom() {
        const maze = document.getElementById('maze');
        maze.style.transform = `scale(${currentZoom})`;
        document.getElementById('zoomLevel').textContent = Math.round(currentZoom * 100) + '%';
    }

    // Initialize with medium preset
    window.addEventListener('load', () => {
        selectedParams = {
            numRooms: 9,
            numAdventurers: 2,
            numKnights: 2,
            numCowards: 2,
            numGluttons: 2,
            numCreatures: 4,
            numDemons: 4,
            numFood: 7,
            numArmor: 2
        };
        renderParameterList();
    });

    // Override getGameParameters to use selectedParams
    function getGameParameters() {
        const playerName = document.getElementById("playerName").value;

        return {
            playerName: playerName,
            numRooms: selectedParams.numRooms || 0,
            numAdventurers: selectedParams.numAdventurers || 0,
            numKnights: selectedParams.numKnights || 0,
            numCowards: selectedParams.numCowards || 0,
            numGluttons: selectedParams.numGluttons || 0,
            numCreatures: selectedParams.numCreatures || 0,
            numDemons: selectedParams.numDemons || 0,
            numFood: selectedParams.numFood || 0,
            numArmor: selectedParams.numArmor || 0
        };
    }
</script>
</body>
</html>
